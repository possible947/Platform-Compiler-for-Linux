[inference.roles.runtime_forensic_analyzer]
provider = "local"
endpoint = "http://127.0.0.1:8080/v1"
model = "configured-runtime-analysis-model"

[inference.roles.deep_runtime_forensic_analyzer]
provider = "local"
endpoint = "http://127.0.0.1:8081/v1"
model = "configured-deep-analysis-model"

[inference.roles.repair_engineer]
provider = "local"
endpoint = "http://127.0.0.1:8082/v1"
model = "configured-repair-model"
