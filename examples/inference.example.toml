[inference.roles.deep_repair_engineer]
provider = "local"
endpoint = "http://127.0.0.1:8083/v1"
model = "configured-deep-repair-model"
reasoning_effort = "high"

[inference.roles.frontier_reviewer]
provider = "external-compatible"
endpoint = "https://example.invalid/v1"
model = "configured-review-model"
api_key_env = "PLATFORM_COMPILER_REVIEW_API_KEY"
